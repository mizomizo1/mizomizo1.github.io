<article class="blog-intro blog-hero">
  <div class="blog-hero__content">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="blog-intro__description prose dark:prose-invert">{{ . }}</div>{{ end }}
  <a class="blog-button" href="{{ "posts/" | relLangURL }}">記事を読む {{ partial "icon.html" "bi-arrow-right" }}</a>
  </div>
  <div class="blog-hero__art" aria-hidden="true">
    <div class="blog-hero__orbit blog-hero__orbit--outer"></div>
    <div class="blog-hero__orbit blog-hero__orbit--inner"></div>
    <span class="blog-hero__code">{{ partial "icon.html" "bi-code-slash" }}</span>
    <span class="blog-hero__satellite blog-hero__satellite--journal">{{ partial "icon.html" "bi-journal-text" }}</span>
    <span class="blog-hero__satellite blog-hero__satellite--tags">{{ partial "icon.html" "bi-tags" }}</span>
  </div>
</article>
