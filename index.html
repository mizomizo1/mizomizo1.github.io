<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="mizomizo1の個人サイトです。"
    >
    <meta name="theme-color" content="#f5f7fb">
    <title>mizomizo1.github.io</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 8vw, 4.5rem);
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        background: #fff;
        box-shadow: 0 1.5rem 4rem rgb(23 32 51 / 8%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #5266d4;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .intro {
        margin: 1.5rem 0 0;
        color: #536078;
        font-size: 1.1rem;
        line-height: 1.8;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.8rem 1.1rem;
        border-radius: 0.65rem;
        color: #fff;
        background: #394fc4;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        background: #293da7;
      }

      a:focus-visible {
        outline: 3px solid #aeb8ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Personal website</p>
      <h1>mizomizo1.github.io</h1>
      <p class="intro">
        GitHub Pagesで公開している個人サイトです。<br>
        ただいまコンテンツを準備中です。
      </p>
      <a href="https://github.com/mizomizo1">GitHubプロフィールを見る</a>
    </main>
  </body>
</html>
